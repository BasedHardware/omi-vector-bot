name: Bot bug
description: Report a reproducible runtime, Discord, ingestion, database, GitHub, or order-flow problem.
title: "Bug: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened without including customer PII or secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
      description: Remove tokens, emails, order details, Discord IDs when unnecessary, and private URLs.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed customer personal data and secrets.
          required: true
